<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" role="img" aria-label="Sadar Judi">
  <defs>
    <linearGradient id="logoShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- shield mark -->
  <g transform="translate(8 8)">
    <path d="M32 0 L60 10 V34 C60 52 48 64 32 70 C16 64 4 52 4 34 V10 Z"
          fill="url(#logoShield)" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round"/>
    <polyline points="16,28 26,38 35,33 48,52"
              fill="none" stroke="#fb7185" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 52 L41 50 M48 52 L47 45" fill="none" stroke="#fb7185"
          stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- wordmark -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="88" y="42" font-size="30" font-weight="800" fill="url(#wordmark)">Sadar Judi</text>
    <text x="89" y="62" font-size="12" font-weight="500" fill="#94a3b8">Simulasi edukatif risiko perjudian</text>
  </g>
