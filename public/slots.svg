<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="Ilustrasi edukatif mesin slot">
  <defs>
    <linearGradient id="bgSlots" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bgSlots)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- reels -->
    <g>
      <rect x="70" y="70" width="70" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <rect x="165" y="70" width="70" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <rect x="260" y="70" width="70" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <text x="105" y="128" text-anchor="middle" font-size="34" font-weight="700" fill="#fbbf24">7</text>
      <text x="200" y="128" text-anchor="middle" font-size="34" font-weight="700" fill="#94a3b8">7</text>
      <text x="295" y="128" text-anchor="middle" font-size="34" font-weight="700" fill="#fbbf24">$</text>
    </g>
    <text x="200" y="44" text-anchor="middle" font-size="22" font-weight="800" fill="#e2e8f0">SLOTS</text>
    <!-- house edge tag -->
    <g>
      <rect x="135" y="178" width="130" height="26" rx="13" fill="#9f1239" opacity="0.85"/>
      <text x="200" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#fecdd3">House edge ≈ 8%</text>
