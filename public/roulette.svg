<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-label="Ilustrasi edukatif roda roulette">
  <defs>
    <linearGradient id="bgRou" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bgRou)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="200" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#e2e8f0">ROULETTE</text>
    <!-- wheel -->
    <g transform="translate(200 118)">
      <circle r="58" fill="#0f172a" stroke="#334155" stroke-width="3"/>
      <path d="M0 -58 A58 58 0 0 1 50 29 L0 0 Z" fill="#38bdf8" opacity="0.85"/>
      <path d="M50 29 A58 58 0 0 1 -50 29 L0 0 Z" fill="#1d4ed8" opacity="0.85"/>
      <path d="M-50 29 A58 58 0 0 1 0 -58 L0 0 Z" fill="#0ea5e9" opacity="0.55"/>
      <circle r="16" fill="#0b1222" stroke="#475569" stroke-width="2"/>
    </g>
    <!-- house edge tag -->
    <g>
      <rect x="130" y="186" width="140" height="24" rx="12" fill="#9f1239" opacity="0.85"/>
      <text x="200" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#fecdd3">House edge ≈ 25%</text>
    </g>
  </g>
</svg>
