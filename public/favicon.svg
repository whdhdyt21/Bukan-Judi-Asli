<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo Sadar Judi">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
  </defs>
  <!-- shield -->
  <path d="M32 4 L54 12 V30 C54 45 44 55 32 60 C20 55 10 45 10 30 V12 Z"
        fill="url(#shield)" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- declining chart line: judi = rugi -->
  <polyline points="18,24 27,32 35,28 46,44"
            fill="none" stroke="#fb7185" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrowhead pointing down -->
  <path d="M46 44 L40 42 M46 44 L45 38" fill="none" stroke="#fb7185"
        stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
